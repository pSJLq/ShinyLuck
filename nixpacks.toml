# Nixpacks build plan for the reveal-bot service on Railway.
# Two Node 20 phases: install root deps (hardhat + ethers + commit-reveal libs),
# compile contracts once at build time so the deploy phase boots in seconds,
# then run our bootstrap wrapper which decodes the seeds-from-env and execs
# the canonical scripts/reveal-bot.js.

[phases.setup]
nixPkgs = ["nodejs_20", "git"]

[phases.install]
# --legacy-peer-deps because package.json carries react^19 alongside
# @privy-io/react-auth@^3 whose peerDep is react@^18 - npm 10+ refuses
# the install otherwise. The Privy bundle is built locally with the same
# flag, so this matches the dev environment.
cmds = ["npm install --no-audit --no-fund --legacy-peer-deps"]

[phases.build]
cmds = ["npx hardhat compile --quiet"]

[start]
cmd = "node scripts/_reveal-bot-bootstrap.js"
