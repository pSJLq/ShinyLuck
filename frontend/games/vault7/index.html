<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VAULT.7 · Classic Slot 5×3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Absolute paths - works even when http-server doesn't redirect trailing-slash. -->
<link rel="stylesheet" href="/v2.css">
<link rel="stylesheet" href="/games/vault7/styles.css">
<style>
  /* Merged-site re-tint: base surfaces follow the gold/matte design system.
     Game feedback colors (win/lose, candy art, reel symbols) stay untouched. */
  :root {
    --bg-0: #0A0A0B; --bg-1: #0A0A0C; --bg-2: #101014;
    --line: #17171C; --line-2: #24242A;
    --violet: #D9B970; --purple: #C9A961;
    --gold: #D9B970; --amber: #E9CC85;
  }
  .ambient {
    background:
      radial-gradient(60% 50% at 50% -10%, rgba(217,185,112,.10), transparent 70%),
      linear-gradient(180deg, #0B0A08 0%, #0A0A0B 50%, #070708 100%) !important;
  }
  .ambient-orb, .ambient-stars { display: none !important; }
  /* fit the whole machine on one screen (desktop) */
  @media (min-width: 861px) { .vault-shell { zoom: .85; } }
</style>

<style>
  /* Custom RAF cursor (from partials.js) stays ON for vault7 - the page
     is light enough. Only the heavy ambient orb background is disabled
     to keep the reel animation at 60fps. */
  .vault-shell .ambient,
  .vault-shell .ambient-orb { display: none !important; }

  .sl-connect-prompt {
    position: fixed; inset: 0; display: flex; align-items: center;
    justify-content: center; padding: 24px; z-index: 50;
    background: radial-gradient(ellipse at center, rgba(217,185,112,0.08), rgba(7,7,8,0.94));
    backdrop-filter: blur(6px);
    font-family: 'JetBrains Mono', monospace;
  }
  .sl-connect-prompt .card {
    text-align: center; padding: 36px 44px; max-width: 460px;
    border: 1px solid rgba(217,185,112,0.18); border-radius: 18px;
    background: linear-gradient(135deg, #14110B, #0A0A0C);
    box-shadow: 0 24px 80px rgba(217,185,112,0.14);
  }
  .sl-connect-prompt h2 { margin: 0 0 12px; font-size: 24px; color: #F6F1E7; letter-spacing: 1px; }
  .sl-connect-prompt p  { color: #A5A29B; margin: 0 0 18px; line-height: 1.55; font-size: 13px; }
  .sl-connect-prompt small { color: #6b6b75; font-size: 11px; }
</style>
  <script type="module" src="/lib/i18n.js"></script>
</head>
<body data-active-page="games">
<div data-page-shell>

<div data-mount="nav"></div>

<div style="display:flex;align-items:flex-start">
  <div data-mount="side"></div>
  <main data-r-padb-m style="flex:1;min-width:0">
    <div id="slot-root"></div>
    <div data-mount="footer"></div>
  </main>
</div>

</div>

<div class="sl-connect-prompt" id="connect-prompt" style="display:none">
  <div class="card">
    <h2>VAULT.7 · 5×3 / 20 lines</h2>
    <p>Sign in to play on Somnia Testnet. Reels are seeded by the contract -
       every spin's randomness is published after reveal.</p>
    <p style="color:#fafafa;font-size:13px;">Use the <b>Connect Wallet</b> button in the top right.</p>
    <small>email login → Somnia Global Wallet · no extension required</small>
  </div>
</div>

<script src="/lib/console-filter.js"></script>
<script src="/vendor/privy.bundle.js"></script>
<script src="/partials.js" defer></script>
<script type="module" src="/lib/livedata.js"></script>

<script type="module">
  import { Vault7Slot } from '/games/vault7/api.js?v=fast1';
  import { SL } from '/lib/wallet.js';
  import { decodeVault7Result } from '/lib/slot-decoders.js';
  import { CONFIG } from '/lib/config.js';
  import { clampStake } from '/lib/casino-limits.js';
  import { toast } from '/lib/ui.js';

  async function clampOrToast(stakeWei, game) {
    try {
      const { stake, clamped } = await clampStake(stakeWei, game);
      if (clamped) {
        const human = (Number(stake) / 1e18).toFixed(4);
        toast(`Stake clamped to ${human} STT (live max).`, { kind: 'warn', ttl: 4000 });
      }
      return stake;
    } catch (e) {
      toast(e.message || 'Casino is restocking', { kind: 'warn', ttl: 4500 });
      throw e;
    }
  }

  const root = document.getElementById('slot-root');
  const prompt = document.getElementById('connect-prompt');
  let currentSlot = null;
  let mounting = false;

  // Replace the session placeholder in the Provably Fair side-panel with the
  // REAL on-chain values from a settled bet: the actual betId (nonce), the
  // client seed the contract recorded, and the revealed server seed. This is
  // what makes the panel verifiable rather than a baked-in display.
  function updateFairPanel(settled, betId) {
    // pin THIS spin on the fair page (it accepts ?betId=N) - new tab so
    // the reels keep spinning behind
    try {
      const a = document.querySelector('[data-fair-page]');
      if (a && betId != null) { a.href = '/fair?betId=' + betId; a.style.display = 'block'; }
    } catch (_) {}
    try {
      if (betId != null) {
        const fn = document.querySelector('[data-fair-nonce]');
        // mark as chain-pinned: the engine's _updateUI repaints this field
        // from its internal counter after every spin and would stomp the
        // real bet id back to 000000
        if (fn) { fn.textContent = String(betId).padStart(6, '0'); fn.dataset.pinned = '1'; }
      }
      const a = (settled && settled.args) ? settled.args : (settled || {});
      const cs = settled?.clientSeed || a.clientSeed;
      if (cs && typeof cs === 'string') {
        const fc = document.querySelector('[data-fair-client]');
        if (fc) fc.textContent = cs;
      }
      const ss = settled?.serverSeed || a.serverSeed;
      const ZERO32 = '0x' + '0'.repeat(64);
      if (ss && typeof ss === 'string' && ss !== ZERO32) {
        const fsv = document.querySelector('[data-fair-server]');
        // Show the FULL revealed server seed (matches the client-seed row,
        // which is shown in full) so it's copy-pasteable for verification -
        // not a truncated …with dots… version.
        if (fsv) { fsv.textContent = ss; fsv.style.wordBreak = 'break-all'; }
      }
    } catch (_) {}
  }

  async function mountProduction() {
    if (mounting || currentSlot) return;
    if (!SL.address || !SL.signer) {
      console.warn('[vault7] mountProduction called but SL not ready yet');
      return;
    }
    mounting = true;
    // Hide the prompt the moment we commit - if mounting fails, we restore it
    // in the catch block.
    prompt.style.display = 'none';
    try {
      const playerBalance = await SL.getNativeBalance();
      currentSlot = new Vault7Slot(root, {
        mode: 'production',
        initialBalance: playerBalance,
        turbo: true,
        // Bubbled from api.js's spin() catch - show a toast instead of the
        // silent revert that leaves the reels in a frozen state.
        onError: ({ kind, message }) => {
          const ttl = kind === 'paused' ? 5000 : 4500;
          toast(message, { kind: 'warn', ttl });
        },
        onSpinRequest: async (stakeWei) => {
          // Per-step timing log so the wait breakdown is visible in DevTools.
          const tStart = performance.now();
          // Free-spin credits live ON-CHAIN (Casino.freeSpinsAvailable). If the
          // player has any, this spin consumes one for free (placeSlotsBet with
          // useFreeSpin=true → no charge, ×2 multiplier); otherwise it's a
          // normal paid spin. This is the real FREE SPINS path - previously the
          // page always sent useFreeSpin=false, so the on-chain credits were
          // never spent and every spin (incl. the bonus round) was charged.
          let useFree = false;
          try { useFree = (await SL.casino.freeSpinsAvailable(SL.address)) > 0n; } catch (_) {}

          const t1 = performance.now();
          const stake = useFree ? stakeWei : await clampOrToast(stakeWei, 'slots');
          const clampMs = performance.now() - t1;

          const t2 = performance.now();
          const placeRes = await SL.placeSlots(Number(stake) / 1e18, useFree);
          const placeMs = performance.now() - t2;

          const t3 = performance.now();
          const settled = await SL.waitForSettle(placeRes.betId);
          const waitMs = performance.now() - t3;

          const totalMs = performance.now() - tStart;
          console.log(`[vault7] spin total ${totalMs.toFixed(0)}ms  (clamp ${clampMs.toFixed(0)}ms · place ${placeMs.toFixed(0)}ms · wait ${waitMs.toFixed(0)}ms)${useFree ? ' [FREE SPIN]' : ''}`);

          updateFairPanel(settled, placeRes.betId);
          const result = decodeVault7Result({ settled, stakeWei: stake, isBuyBonus: false });
          // Authoritative remaining free-spin balance straight from the
          // contract (post-settle) so the badge + paid/free gating are exact.
          try { result.freeSpinsRemaining = Number(await SL.casino.freeSpinsAvailable(SL.address)); } catch (_) {}
          return result;
        },
        onBuyBonusRequest: async (stakeWei) => {
          const free = await SL.casino.freeBankroll();
          const required = BigInt(stakeWei) * 75n * 2000n;
          if (required > free) {
            const human = (Number(required) / 1e18).toFixed(0);
            const have = (Number(free) / 1e18).toFixed(2);
            toast(`Buy bonus needs ~${human} STT bankroll, casino has ${have} STT.`, { kind: 'warn', ttl: 6000 });
            throw new Error('buy-bonus: insufficient casino bankroll');
          }
          const stake = await clampOrToast(stakeWei, 'slots');
          const placeRes = await SL.buyBonusVault7(Number(stake) / 1e18);
          const settled = await SL.waitForSettle(placeRes.betId);
          updateFairPanel(settled, placeRes.betId);
          const result = decodeVault7Result({ settled, stakeWei: stake, isBuyBonus: true });
          // Buy-bonus awards the free-spin credits on-chain - read the real
          // count so the badge shows + the subsequent spins run for free.
          try { result.freeSpinsRemaining = Number(await SL.casino.freeSpinsAvailable(SL.address)); } catch (_) {}
          return result;
        },
        onSpinCompleted: async () => {
          try {
            const bal = await SL.getNativeBalance();
            currentSlot.updateBalance(bal);
          } catch (e) { console.warn('[vault7] balance refresh failed:', e.message); }
        },
      });
      if (currentSlot.animator) currentSlot.animator.setTurbo(true);
      currentSlot.turbo = true;
      window.slot = currentSlot;

      // Live RTP from the contract (slots = game id 2). The LLM RTP agent
      // flexes it via casino.adjustSlotRTP; pull once now + on every
      // RtpAdjusted so the hero figure is the real on-chain value, not a
      // baked-in 92%. Mirrors the Sugar page.
      async function refreshRtp() {
        try {
          const rtp = await SL.casino.getReportedRTP(2);
          if (!rtp) return;
          const pct = (Number(rtp) / 100).toFixed(2) + '%';
          document.querySelectorAll('[data-sl="rtp"][data-game="slots"]').forEach((el) => { el.textContent = pct; });
        } catch (_) {}
      }
      refreshRtp();
      try {
        const { wsProvider } = await import('/lib/rpc.js');
        const ws2 = wsProvider && wsProvider();
        if (ws2) {
          const topicRtp = SL.casino.interface.getEvent('RtpAdjusted').topicHash;
          ws2.on({ address: SL.casino.target, topics: [topicRtp] }, refreshRtp);
        }
      } catch (_) {}
    } catch (e) {
      console.error('[vault7] mount failed:', e);
      prompt.style.display = '';
      currentSlot = null;
      toast('Mount failed: ' + (e.message || e), { kind: 'error', ttl: 5000 });
    } finally {
      mounting = false;
    }
  }

  // Mount-trigger uses a polling loop so we catch the case where Privy
  // restored its session before this page's listeners attached. See the sugar
  // page for the same logic + rationale.
  let pollHandle = null;
  function tryMount() {
    if (currentSlot || mounting) return true;
    if (!SL.address || !SL.signer) return false;
    mountProduction().catch(() => {});
    return true;
  }
  // Reveal the connect card ONLY once Privy has actually settled as
  // signed-out · showing it while the session restores made it flash at
  // players who were already logged in.
  import('/lib/auth-gate.js').then(({ whenAuthSettled }) => whenAuthSettled()).then((authed) => {
    if (!authed && !currentSlot && !SL.address) prompt.style.display = '';
  }).catch(() => {});
  document.addEventListener('shinyluck:connected', tryMount);
  document.addEventListener('shinyluck:auth-state', tryMount);
  pollHandle = setInterval(() => {
    if (tryMount()) clearInterval(pollHandle);
  }, 250);
  setTimeout(() => { if (pollHandle) clearInterval(pollHandle); }, 30000);
  tryMount();
</script>
</body>
</html>
