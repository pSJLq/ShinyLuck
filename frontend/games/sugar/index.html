<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SUGAR.LAB · Cluster Cascade 7×7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Absolute paths so the page works even when http-server serves index.html
     without redirecting `/games/sugar` → `/games/sugar/` (trailing slash). -->
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/games/sugar/styles.css">
<style>
  /* Use native OS cursor on slot pages — the shared custom cursor's
     trailing ring can lag behind the cascade animation on lower-end
     hardware. Also kill the heaviest decorations (ambient orbs + marquee
     scroll) for the same reason — they're pure decoration. */
  html, body { cursor: auto !important; }
  .cursor-dot, .cursor-ring { display: none !important; }
  .sugar-shell .ambient,
  .sugar-shell .ambient-orb { display: none !important; }
  .sugar-shell .marquee .scroll,
  .sugar-shell .marquee .track { animation: none !important; }

  .sl-connect-prompt {
    position: fixed; inset: 0; display: flex; align-items: center;
    justify-content: center; padding: 24px; z-index: 50;
    background: radial-gradient(ellipse at center, rgba(124,58,237,0.08), rgba(8,10,18,0.94));
    backdrop-filter: blur(6px);
    font-family: 'JetBrains Mono', monospace;
  }
  .sl-connect-prompt .card {
    text-align: center; padding: 36px 44px; max-width: 460px;
    border: 1px solid rgba(255,255,255,0.08); border-radius: 18px;
    background: linear-gradient(135deg, #1a1830, #0e0d20);
    box-shadow: 0 24px 80px rgba(124,58,237,0.18);
  }
  .sl-connect-prompt h2 { margin: 0 0 12px; font-size: 24px; color: #fff; letter-spacing: 1px; }
  .sl-connect-prompt p  { color: #b6b0c8; margin: 0 0 18px; line-height: 1.55; font-size: 13px; }
  .sl-connect-prompt small { color: #6b6b75; font-size: 11px; }
</style>
</head>
<body data-active-page="games">
<div data-page-shell>

<div data-mount="nav"></div>

<div id="slot-root"></div>

<div data-mount="footer"></div>

</div>

<!-- Pre-connect overlay. Slot does NOT mount until wallet is connected.
     Hidden as soon as `shinyluck:connected` fires. -->
<div class="sl-connect-prompt" id="connect-prompt">
  <div class="card">
    <h2>SUGAR.LAB · Cluster Cascade</h2>
    <p>Sign in to play on Somnia Testnet. Bets settle on-chain — every
       cluster grid is provably fair and the seed is published after reveal.</p>
    <p style="color:#fafafa;font-size:13px;">Use the <b>Connect Wallet</b> button in the top right.</p>
    <small>email login → Somnia Global Wallet · no extension required</small>
  </div>
</div>

<script src="/vendor/privy.bundle.js"></script>
<script src="/partials.js" defer></script>
<script type="module" src="/lib/livedata.js"></script>

<script type="module">
  import { SugarSlot } from '/games/sugar/api.js?v=fast1';
  import { SL } from '/lib/wallet.js';
  import { decodeSugarLabResult, extractChargeMeterEvent } from '/lib/slot-decoders.js';
  import { CONFIG } from '/lib/config.js';
  import { clampStake } from '/lib/casino-limits.js';
  import { toast } from '/lib/ui.js';

  async function clampOrToast(stakeWei, game) {
    try {
      const { stake, clamped } = await clampStake(stakeWei, game);
      if (clamped) {
        const human = (Number(stake) / 1e18).toFixed(4);
        toast(`Stake clamped to ${human} STT (live max).`, { kind: 'warn', ttl: 4000 });
      }
      return stake;
    } catch (e) {
      toast(e.message || 'Casino is restocking, try a smaller stake', { kind: 'warn', ttl: 4500 });
      throw e;
    }
  }

  const root = document.getElementById('slot-root');
  const prompt = document.getElementById('connect-prompt');
  let currentSlot = null;
  let mounting = false;

  async function mountProduction() {
    if (mounting || currentSlot) return;
    if (!SL.address || !SL.signer) {
      console.warn('[sugar] mountProduction called but SL not ready yet');
      return;
    }
    mounting = true;
    // Hide the prompt the moment we commit — if mounting fails, we restore it
    // in the catch block. This prevents the prompt from sticking around while
    // a slow SugarSlot constructor runs.
    prompt.style.display = 'none';
    try {
      const playerBalance = await SL.getNativeBalance();
      let chargeMeter = { current: 0, threshold: 240 };
      try {
        const raw = await SL.casino.getChargeMeter(SL.address);
        chargeMeter = { current: Number(raw.current) / 100, threshold: Number(raw.threshold) / 100 };
      } catch (e) { console.warn('[sugar] getChargeMeter failed:', e.message); }

      currentSlot = new SugarSlot(root, {
        mode: 'production',
        initialBalance: playerBalance,
        initialChargeMeter: { current: chargeMeter.current, threshold: chargeMeter.threshold },
        turbo: true,
        // Surface typed contract reverts as toasts (paused / bankroll-low /
        // generic) instead of swallowing them silently.
        onError: ({ kind, message }) => {
          const ttl = kind === 'paused' ? 5000 : 4500;
          toast(message, { kind: 'warn', ttl });
        },

        onSpinRequest: async (stakeWei) => {
          // Per-step timing log so you can see exactly where the wait is.
          // Output looks like:  [sugar] spin total 5234ms  (clamp 87ms · place 1432ms · wait 3520ms · receipt 195ms)
          const tStart = performance.now();
          const tag = (label, t0) => `${label} ${(performance.now() - t0).toFixed(0)}ms`;

          const t1 = performance.now();
          const stake = await clampOrToast(stakeWei, 'cluster');
          const clampMs = performance.now() - t1;

          const t2 = performance.now();
          const placeRes = await SL.placeCluster(Number(stake) / 1e18, false);
          const placeMs = performance.now() - t2;

          const t3 = performance.now();
          const settled = await SL.waitForSettle(placeRes.betId);
          const waitMs = performance.now() - t3;

          const t4 = performance.now();
          let chargeEvent = null;
          try {
            const rec = await SL.provider.getTransactionReceipt(settled.txHash);
            chargeEvent = extractChargeMeterEvent(SL.casino, rec?.logs || []);
          } catch (_) {}
          const receiptMs = performance.now() - t4;

          const totalMs = performance.now() - tStart;
          console.log(`[sugar] spin total ${totalMs.toFixed(0)}ms  (clamp ${clampMs.toFixed(0)}ms · place ${placeMs.toFixed(0)}ms · wait ${waitMs.toFixed(0)}ms · receipt ${receiptMs.toFixed(0)}ms)`);

          return decodeSugarLabResult({ settled, stakeWei: stake, chargeEvent, isBuyBonus: false });
        },

        onBuyBonusRequest: async (stakeWei) => {
          const free = await SL.casino.freeBankroll();
          const required = BigInt(stakeWei) * 100n * 2500n;
          if (required > free) {
            const human = (Number(required) / 1e18).toFixed(0);
            const have = (Number(free) / 1e18).toFixed(2);
            toast(`Buy bonus needs ~${human} STT bankroll, casino has ${have} STT. Spin normally instead.`, { kind: 'warn', ttl: 6000 });
            throw new Error('buy-bonus: insufficient casino bankroll');
          }
          const stake = await clampOrToast(stakeWei, 'cluster');
          const placeRes = await SL.buyBonusCluster(Number(stake) / 1e18);
          const settled = await SL.waitForSettle(placeRes.betId);
          let chargeEvent = null;
          try {
            const rec = await SL.provider.getTransactionReceipt(settled.txHash);
            chargeEvent = extractChargeMeterEvent(SL.casino, rec?.logs || []);
          } catch (_) {}
          return decodeSugarLabResult({ settled, stakeWei: stake, chargeEvent, isBuyBonus: true });
        },

        onChargeRewardClaimed: async () => {
          try { await SL.claimChargeReward(); }
          catch (e) { console.warn('[sugar] claim failed:', e.message); }
        },

        onSpinCompleted: async () => {
          try {
            const bal = await SL.getNativeBalance();
            currentSlot.updateBalance(bal);
            const cm = await SL.casino.getChargeMeter(SL.address);
            currentSlot.updateChargeMeter(Number(cm.current) / 100, Number(cm.threshold) / 100);
          } catch (e) { console.warn('[sugar] post-spin refresh failed:', e.message); }
        },
      });
      if (currentSlot.animator) currentSlot.animator.setTurbo(true);
      currentSlot.turbo = true;
      window.slot = currentSlot;
    } catch (e) {
      console.error('[sugar] mount failed:', e);
      // Restore the prompt so the user isn't staring at a blank screen.
      prompt.style.display = '';
      currentSlot = null;
      toast('Mount failed: ' + (e.message || e), { kind: 'error', ttl: 5000 });
    } finally {
      mounting = false;
    }
  }

  // Mount-trigger is a polling loop instead of a single event listener.
  // Rationale: when navigating from another page, Privy bootstraps + restores
  // session asynchronously, and `shinyluck:connected` may fire either BEFORE
  // our listener attaches or AFTER `SL.address` is populated. The poller
  // catches both cases and survives a slow Privy bootstrap.
  let pollHandle = null;
  function tryMount() {
    if (currentSlot || mounting) return true;
    if (!SL.address || !SL.signer) return false;
    mountProduction().catch(() => {});
    return true;
  }
  document.addEventListener('shinyluck:connected', tryMount);
  document.addEventListener('shinyluck:auth-state', tryMount);
  // Poll every 250ms for up to 30s. Cleared as soon as a mount starts or the
  // page is closed. We intentionally do NOT show an error if we time out —
  // the prompt is already visible, the user just needs to connect.
  pollHandle = setInterval(() => {
    if (tryMount()) clearInterval(pollHandle);
  }, 250);
  setTimeout(() => { if (pollHandle) clearInterval(pollHandle); }, 30000);
  // Run once immediately for the case where the wallet was already connected
  // before this script's listeners attached (typical page-to-page navigation).
  tryMount();
</script>
</body>
</html>
