<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SUGAR.LAB · Cluster Cascade 7×7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="styles.css">
</head>
<body data-active-page="games">
<div data-page-shell>

<!-- Shared site nav (injected by partials.js — matches lobby + dice etc.) -->
<div data-mount="nav"></div>

<div id="slot-root"></div>

<!-- Shared site footer (injected by partials.js) -->
<div data-mount="footer"></div>

</div>

<!-- Privy vendor bundle — must load BEFORE wallet.js so window.ShinyLuckAuth
     is initialised (even as a not-ready stub) before any module touches it.
     partials.js loads after to inject nav + footer chrome. -->
<script src="/vendor/privy.bundle.js"></script>
<script src="/partials.js" defer></script>
<script type="module" src="/lib/livedata.js"></script>

<script type="module">
  // No gate page — slot mounts immediately. If user is not connected, slot
  // runs in demo mode (deterministic local engine). When the user clicks
  // the partials nav's "Connect Wallet" button and `shinyluck:connected`
  // fires, we hot-swap to production mode (live placeCluster + waitForSettle).
  import { SugarSlot } from './api.js';
  import { SL, connect } from '/lib/wallet.js';
  import { decodeSugarLabResult, extractChargeMeterEvent } from '/lib/slot-decoders.js';
  import { CONFIG } from '/lib/config.js';
  import { clampStake } from '/lib/casino-limits.js';
  import { toast } from '/lib/ui.js';

  async function clampOrToast(stakeWei, game) {
    try {
      const { stake, clamped } = await clampStake(stakeWei, game);
      if (clamped) {
        const human = (Number(stake) / 1e18).toFixed(4);
        toast(`Stake clamped to ${human} STT (live max). Casino restocking.`, { kind: 'warn', ttl: 4000 });
      }
      return stake;
    } catch (e) {
      toast(e.message || 'Casino is restocking, try a smaller stake', { kind: 'warn', ttl: 4500 });
      throw e;
    }
  }

  const root = document.getElementById('slot-root');
  let currentSlot = null;
  let mode = 'demo';  // current mode of the mounted slot

  function mountDemo() {
    if (currentSlot && mode === 'demo') return;
    if (currentSlot) currentSlot.destroy();
    mode = 'demo';
    currentSlot = new SugarSlot(root, {
      mode: 'demo',
      initialBalance: 1000n * 1_000_000_000_000_000_000n,
      onSpinCompleted: (r) => console.debug('[sugar/demo] payout', r.totalPayout),
    });
    window.slot = currentSlot;
  }

  async function mountProduction() {
    if (currentSlot) currentSlot.destroy();
    mode = 'production';

    const playerBalance = await SL.getNativeBalance();
    let chargeMeter = { current: 0, threshold: 240 };
    try {
      const raw = await SL.casino.getChargeMeter(SL.address);
      chargeMeter = { current: Number(raw.current) / 100, threshold: Number(raw.threshold) / 100 };
    } catch (e) { console.warn('[sugar] getChargeMeter failed:', e.message); }

    currentSlot = new SugarSlot(root, {
      mode: 'production',
      initialBalance: playerBalance,
      initialChargeMeter: { current: chargeMeter.current, threshold: chargeMeter.threshold },
      // Turbo by default in production — empty baseCascades (no per-step
      // animation) + faster sleep timing means the spin lands in ~1s after
      // settle instead of ~3s of grid-drop-and-hold.
      turbo: true,

      onSpinRequest: async (stakeWei) => {
        const stake = await clampOrToast(stakeWei, 'cluster');
        const placeRes = await SL.placeCluster(Number(stake) / 1e18, false);
        const settled = await SL.waitForSettle(placeRes.betId);
        let chargeEvent = null;
        try {
          const txReceipt = await SL.provider.getTransactionReceipt(settled.txHash);
          chargeEvent = extractChargeMeterEvent(SL.casino, txReceipt?.logs || []);
        } catch (_) {}
        return decodeSugarLabResult({ settled, stakeWei: stake, chargeEvent, isBuyBonus: false });
      },

      onBuyBonusRequest: async (stakeWei) => {
        const free = await SL.casino.freeBankroll();
        const required = BigInt(stakeWei) * 100n * 2500n;
        if (required > free) {
          const human = (Number(required) / 1e18).toFixed(0);
          const have = (Number(free) / 1e18).toFixed(2);
          toast(`Buy bonus needs ~${human} STT bankroll, casino has ${have} STT. Spin normally — same RTP.`, { kind: 'warn', ttl: 6000 });
          throw new Error('buy-bonus: insufficient casino bankroll');
        }
        const stake = await clampOrToast(stakeWei, 'cluster');
        const placeRes = await SL.buyBonusCluster(Number(stake) / 1e18);
        const settled = await SL.waitForSettle(placeRes.betId);
        let chargeEvent = null;
        try {
          const txReceipt = await SL.provider.getTransactionReceipt(settled.txHash);
          chargeEvent = extractChargeMeterEvent(SL.casino, txReceipt?.logs || []);
        } catch (_) {}
        return decodeSugarLabResult({ settled, stakeWei: stake, chargeEvent, isBuyBonus: true });
      },

      onChargeRewardClaimed: async () => {
        try { await SL.claimChargeReward(); }
        catch (e) { console.warn('[sugar] claim failed:', e.message); }
      },

      onSpinCompleted: async () => {
        try {
          const bal = await SL.getNativeBalance();
          currentSlot.updateBalance(bal);
          const cm = await SL.casino.getChargeMeter(SL.address);
          currentSlot.updateChargeMeter(Number(cm.current) / 100, Number(cm.threshold) / 100);
        } catch (e) { console.warn('[sugar] post-spin refresh failed:', e.message); }
      },
    });
    // Explicitly turbo the animator (constructor flag is read by api.js, but
    // the animator instance is created inside — flip it directly to be sure).
    if (currentSlot.animator) currentSlot.animator.setTurbo(true);
    currentSlot.turbo = true;
    window.slot = currentSlot;
  }

  // Mount immediately in demo mode so the slot is interactive from page load.
  mountDemo();

  // Hot-swap to production when the user connects via partials' Connect button.
  document.addEventListener('shinyluck:connected', () => {
    mountProduction().catch(e => {
      toast('Could not enable on-chain mode: ' + (e.message || e), { kind: 'error', ttl: 5000 });
    });
  });

  // If the user is ALREADY connected on page load (Privy session restored),
  // wait for SL to attach and swap to production.
  if (CONFIG.casino && CONFIG.casino !== '0x0000000000000000000000000000000000000000') {
    setTimeout(() => {
      if (SL.address) mountProduction().catch(() => {});
    }, 2000);
  }
</script>
</body>
</html>
