<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Predictions · ShinyLuck</title>
<link rel="icon" href="/favicon.ico" />
<link rel="stylesheet" href="/v2.css" />
<link rel="stylesheet" href="/predictions.css" />
<script src="/lib/console-filter.js"></script>
<script src="/partials.js" defer></script>
<script src="/vendor/privy.bundle.js"></script>
<script type="module" src="/lib/wallet.js"></script>
<script type="module" src="/lib/i18n.js"></script>
</head>
<body>
  <div class="pw">
    <div class="phead">
      <div class="section-title">Prediction markets on <b>X events</b> · resolved by Somnia on-chain agents</div>
      <div class="pfilter" id="pFilter">
        <button data-filter="active" class="on">Active</button>
        <button data-filter="all">All <span id="fCount"></span></button>
        <button class="gold newbtn" id="newBtn" style="display:none">+ New market</button>
      </div>
    </div>

    <!-- CREATE WIZARD (only for wallets allowed to open markets) -->
    <section id="tab-create" style="display:none">
      <button class="back" id="createBack">&larr; Back to markets</button>
      <div class="pcard wiz">
        <h2 class="wiz-h">Create a market</h2>
        <p class="wiz-sub">Pick what the market is about. Everything the agents need - sources, selectors, buckets - is built for you.</p>

        <div class="fmt-grid" id="fmtGrid"></div>

        <div id="wizForm" style="display:none">
          <div class="wiz-fields" id="wizFields"></div>

          <div class="wiz-when">
            <label>Betting closes
              <input type="datetime-local" id="wClose" />
            </label>
            <div class="wiz-quick">
              <button type="button" data-in="60">in 1h</button>
              <button type="button" data-in="360">6h</button>
              <button type="button" data-in="1440">24h</button>
              <button type="button" data-in="10080">7d</button>
            </div>
          </div>

          <div class="wiz-preview" id="wizPreview"></div>
          <div class="wiz-actions">
            <button class="gold big" id="wizSubmit">Create market · <span id="wizCost">0.5</span> STT</button>
            <span class="hint" id="wizNote"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- MARKETS -->
    <section id="tab-markets">
      <div class="mgrid" id="marketList"><div class="empty">Loading markets…</div></div>
    </section>

    <!-- DETAIL -->
    <section id="tab-detail" style="display:none">
      <button class="back" id="backBtn">&larr; All markets</button>
      <div class="detail-grid">
        <div class="pcard">
          <div class="qrow">
            <h2 id="dQuestion"></h2>
            <span class="badge" id="dBadge"></span>
          </div>
          <div class="meta" id="dMeta"></div>
          <div class="chart-box">
            <div class="chart-legend" id="dLegend"></div>
            <div class="chart-wrap" id="dChartWrap">
              <svg id="dChart" width="100%" height="240"></svg>
              <div class="chart-tip" id="dTip" style="display:none"></div>
            </div>
          </div>
          <div class="outcomes" id="dOutcomes"></div>
          <div class="resolution" id="dResolution"></div>
          <div class="foot" id="dFoot"></div>
        </div>
        <aside class="pcard trade" id="dTrade"></aside>
      </div>
    </section>
  </div>

  <div id="ptoast"></div>
  <script type="module" src="/lib/predictions.js"></script>
</body>
</html>
