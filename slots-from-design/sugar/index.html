<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SUGAR.LAB · Cluster Cascade 7×7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="slot-root"></div>

<script type="module">
  import { SugarSlot } from './api.js';

  // ============================================================================
  // DEMO MODE — engine.js generates ResultData locally.
  // For production (blockchain integration), construct with:
  //   new SugarSlot(el, {
  //     mode: 'production',
  //     initialBalance: 1000000000000000000n,
  //     onSpinRequest:    async (stakeWei) => await contract.spin(stakeWei),
  //     onBuyBonusRequest: async (stakeWei) => await contract.buyBonus(stakeWei),
  //     onSpinCompleted: (result) => { /* react */ },
  //   })
  // ============================================================================

  const root = document.getElementById('slot-root');
  const slot = new SugarSlot(root, {
    mode: 'demo',
    initialBalance: 1000n * 1000000000000000000n, // 1000 STT
    onSpinStarted:   (stakeWei) => console.debug('[sugar] spin started, stake wei =', stakeWei),
    onSpinCompleted: (result)   => console.debug('[sugar] spin completed, total payout wei =', result.totalPayout),
  });

  // expose for debugging
  window.slot = slot;
</script>
</body>
</html>
