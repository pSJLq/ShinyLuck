<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VAULT.7 · Classic Slot 5×3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="slot-root"></div>

<script type="module">
  import { Vault7Slot } from './api.js';

  // ============================================================================
  // DEMO MODE — engine.js generates ResultData locally.
  // For production:
  //   new Vault7Slot(el, {
  //     mode: 'production',
  //     initialBalance: 1000000000000000000n,
  //     onSpinRequest:    async (stakeWei) => await contract.spin(stakeWei),
  //     onBuyBonusRequest: async (stakeWei) => await contract.buyBonus(stakeWei),
  //   })
  // ============================================================================

  const slot = new Vault7Slot(document.getElementById('slot-root'), {
    mode: 'demo',
    initialBalance: 1000n * 1000000000000000000n,
    onSpinStarted:   (stakeWei) => console.debug('[vault7] spin', stakeWei),
    onSpinCompleted: (r)        => console.debug('[vault7] done', r.totalPayout),
  });

  window.slot = slot;
</script>
</body>
</html>
