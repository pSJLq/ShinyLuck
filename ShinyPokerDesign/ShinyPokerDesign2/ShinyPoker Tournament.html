<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ShinyPoker — Tournament Table</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="tournament.css" />
<style>
  #stage { position: fixed; inset: 0; background: radial-gradient(120% 90% at 50% -10%, #0d0d12 0%, #070707 60%);
    display: grid; place-items: center; padding-top: 60px; overflow: hidden; }
  #bgcanvas { position: fixed; inset: 0; width: 100%; height: 100%; opacity: 0.22; pointer-events: none; }
  #root { position: relative; z-index: 2; }
</style>
</head>
<body>
  <canvas id="bgcanvas"></canvas>
  <div id="stage"><div id="root"></div></div>

  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#070707"/>
      <rect x="30" y="30" width="40" height="40" rx="6" fill="#6E6EED"/>
      <text x="50" y="62" font-family="monospace" font-size="26" fill="#fff" text-anchor="middle">{s}</text>
    </svg>
  </template>

  <script src="poker-grid.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="poker-cards.jsx"></script>
  <script type="text/babel" src="poker-scenes.jsx"></script>
  <script type="text/babel" src="poker-seats.jsx"></script>
  <script type="text/babel" src="poker-chrome.jsx"></script>
  <script type="text/babel" src="poker-anno.jsx"></script>
  <script type="text/babel" src="poker-tournament-views.jsx"></script>
  <script type="text/babel" src="poker-tournament.jsx"></script>

  <script>
    window.addEventListener("load", function () {
      var c = document.getElementById("bgcanvas");
      if (window.GridField && c) {
        var bg = new GridField(c, { cell: 22, gap: 7, speed: 0.4, density: 0.5,
          accent: "#6E6EED", accent2: "#9B9BF4", maxAlpha: 0.7, minBright: 0.01, shape: "square" });
        bg.start();
      }
    });
  </script>
</body>
</html>
